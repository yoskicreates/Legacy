name: LEGACY fast-track combat prototype QA
on:
  push:
    branches: [fast-track/playable-combat-s01]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  combat:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:domains
      - run: npm run test:types:negative
      - run: npm test
      - run: node --test tests/fast-track-combat.test.mjs
      - run: npm run build
      - run: test -f dist/fast-track-fight.html
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test Vite dev and preview in real Chromium
        run: |
          set -Eeuo pipefail
          mkdir -p fast-track-qa
          npm run dev -- --strictPort > fast-track-qa/dev.log 2>&1 & dp=$!
          npm run preview -- --strictPort > fast-track-qa/preview.log 2>&1 & pp=$!
          trap 'kill "$dp" "$pp" 2>/dev/null || true' EXIT
          for port in 5173 4173; do
            for i in $(seq 1 40); do
              if curl -fsS "http://127.0.0.1:$port/fast-track-fight.html" >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/fast-track-fight.html" >/dev/null
          done
          python scripts/fast-track-browser-qa.py
      - name: Preserve evidence and full history
        if: always()
        run: |
          mkdir -p fast-track-qa
          git log --oneline --all > fast-track-qa/history.txt
          git bundle create fast-track-qa/full-history.bundle --all
          git archive --format=zip HEAD -o fast-track-qa/source.zip
      # Artifact upload temporarily disabled: GitHub Actions storage quota exceeded.
      # Evidence is generated within the job but not retained remotely until quota is restored.
      - name: Publish standalone Pages branch after all combat checks pass
        if: github.event_name == 'push' && github.ref == 'refs/heads/fast-track/playable-combat-s01'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin legacy-fast-track-pages >/dev/null 2>&1; then
            echo 'Existing preview branch preserved; no overwrite.'
            exit 0
          fi
          mkdir -p /tmp/legacy-personal-site
          cp -a dist/. /tmp/legacy-personal-site/
          cd /tmp/legacy-personal-site
          touch .nojekyll
          git init -b legacy-fast-track-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -m 'Publish isolated LEGACY combat Safari preview'
          git push origin HEAD:refs/heads/legacy-fast-track-pages
