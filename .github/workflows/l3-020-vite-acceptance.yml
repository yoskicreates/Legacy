name: LEGACY 3.0 L3-020 Genuine Vite Acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-vite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out pinned LEGACY 3.0 project
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked official npm dependencies
        run: npm ci
      - name: Verify real Vite installation and complete CLI acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run check:vite
          bash scripts/complete-vite-networked.sh
      - name: Install Chromium test tools
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test real Vite development and production preview in Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p l3-020-acceptance/dev l3-020-acceptance/preview
          npm run dev -- --strictPort >l3-020-acceptance/dev-server.log 2>&1 &
          dp=$!
          npm run preview -- --strictPort >l3-020-acceptance/preview-server.log 2>&1 &
          pp=$!
          trap 'kill "$dp" "$pp" 2>/dev/null || true' EXIT
          for port in 5173 4173; do
            ok=0
            for i in $(seq 1 40); do
              if curl -fsS "http://127.0.0.1:$port/" >/dev/null; then ok=1; break; fi
              sleep 1
            done
            if [[ "$ok" != 1 ]]; then echo "Vite port $port unavailable"; exit 1; fi
          done
          python scripts/chromium-vite-qa.py --base-url http://127.0.0.1:5173/ --out l3-020-acceptance/dev
          python scripts/chromium-vite-qa.py --base-url http://127.0.0.1:4173/ --out l3-020-acceptance/preview
      - name: Collect build and QA evidence
        if: always()
        shell: bash
        run: |
          mkdir -p l3-020-acceptance/source-updates
          for f in package.json package-lock.json; do
            test ! -f "$f" || cp "$f" l3-020-acceptance/source-updates/
          done
          test ! -d dist || cp -a dist l3-020-acceptance/dist
          git status --short > l3-020-acceptance/git-status.txt
          git log --oneline -6 > l3-020-acceptance/git-history.txt
      - name: Upload real Vite acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEGACY3-L3-020-real-vite-acceptance
          path: l3-020-acceptance/
          if-no-files-found: warn
          retention-days: 30
