name: LEGACY 3.0 L3-020 — Genuine Vite acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-vite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact preserved repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python for Chromium acceptance
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Vite and execute CLI acceptance
        run: bash scripts/complete-vite-networked.sh
      - name: Install Chromium browser test tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify real Vite development and preview servers in Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p l3-020-acceptance/dev l3-020-acceptance/preview
          npm run dev -- --strictPort >l3-020-acceptance/dev-server.log 2>&1 &
          dev_pid=$!
          npm run preview -- --strictPort >l3-020-acceptance/preview-server.log 2>&1 &
          preview_pid=$!
          trap 'kill "$dev_pid" "$preview_pid" 2>/dev/null || true' EXIT
          for port in 5173 4173; do
            ready=0
            for i in $(seq 1 40); do
              if curl --fail --silent --output /dev/null "http://127.0.0.1:$port/"; then ready=1; break; fi
              sleep 1
            done
            if [[ "$ready" != 1 ]]; then echo "Vite server port $port unavailable"; exit 1; fi
          done
          python scripts/chromium-vite-qa.py --base-url http://127.0.0.1:5173/ --out l3-020-acceptance/dev
          python scripts/chromium-vite-qa.py --base-url http://127.0.0.1:4173/ --out l3-020-acceptance/preview
          echo 'Real Vite browser and touch interaction checks passed.'
      - name: Record reproducible Vite build artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p l3-020-acceptance/source-updates
          cp package.json package-lock.json l3-020-acceptance/source-updates/ || true
          test ! -d dist || cp -a dist l3-020-acceptance/dist
          git status --short >l3-020-acceptance/git-status.txt
          git log --oneline -6 >l3-020-acceptance/git-history.txt
      - name: Upload acceptance results and real production site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEGACY3-L3-020-vite-acceptance
          path: l3-020-acceptance/
          if-no-files-found: error
          retention-days: 30
