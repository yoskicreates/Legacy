name: LEGACY 3.0 L3-021 Preact and PixiJS Boundary Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    # L3-041 consolidates all inherited regression coverage into one job.
    # Avoid duplicate jobs only for this review PR, not main or other branches.
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'l3-041-panel-card-kit' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out review snapshot
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bootstrap exact Preact and PixiJS package lock on first run
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! grep -q 'node_modules/pixi.js' package-lock.json; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          mkdir -p l3-021-acceptance/lock
          cp package-lock.json l3-021-acceptance/lock/package-lock.json
      - name: Clean npm install
        run: npm ci --no-audit --no-fund
      - name: Type, lint, negative regression and Node tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run check:vite
          npm run typecheck
          npm run test:types:negative
          npm run lint
          npm test
      - name: Genuine Vite production build
        run: npm run build
      - name: Prepare Chromium
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify menu and renderer independence on dev and preview
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p l3-021-acceptance/dev l3-021-acceptance/preview
          npm run dev -- --strictPort >l3-021-acceptance/dev-server.log 2>&1 &
          dev_pid=$!
          npm run preview -- --strictPort >l3-021-acceptance/preview-server.log 2>&1 &
          preview_pid=$!
          trap 'kill "$dev_pid" "$preview_pid" 2>/dev/null || true' EXIT
          for port in 5173 4173; do
            ok=0
            for i in $(seq 1 40); do
              if curl -fsS "http://127.0.0.1:$port/" >/dev/null; then ok=1; break; fi
              sleep 1
            done
            if [[ "$ok" != 1 ]]; then echo "Vite server port $port not ready"; exit 1; fi
          done
          python scripts/chromium-boundary-qa.py --base-url http://127.0.0.1:5173/ --out l3-021-acceptance/dev
          python scripts/chromium-boundary-qa.py --base-url http://127.0.0.1:4173/ --out l3-021-acceptance/preview
          python scripts/chromium-vite-qa.py --base-url http://127.0.0.1:5173/ --out l3-021-acceptance/legacy-dev
          python scripts/chromium-vite-qa.py --base-url http://127.0.0.1:4173/ --out l3-021-acceptance/legacy-preview
      - name: Preserve complete QA evidence
        if: always()
        shell: bash
        run: |
          mkdir -p l3-021-acceptance/lock
          test ! -f package-lock.json || cp package-lock.json l3-021-acceptance/lock/package-lock.json
          test ! -d dist || cp -a dist l3-021-acceptance/dist
          git status --short > l3-021-acceptance/git-status.txt
          git log --oneline -7 > l3-021-acceptance/git-history.txt
      - name: Upload verified QA and lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEGACY3-L3-021-acceptance
          path: l3-021-acceptance/
          if-no-files-found: warn
          retention-days: 30
