name: LEGACY 3.0 L3-023 Route State Acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-state:
    # L3-041 consolidates all inherited regression coverage into one job.
    # Avoid duplicate jobs only for this review PR, not main or other branches.
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'l3-041-panel-card-kit' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact LEGACY 3.0 source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproducible official npm dependency installation
        run: npm ci --no-audit --no-fund
      - name: Verify route reducer without rendering
        run: npm run test:routes
      - name: Run strict TypeScript, previous tests, lint and Vite production build
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run check:vite
          npm run lint:domains
          npm run typecheck
          npm run test:types:negative
          npm run lint
          npm test
          npm run build
      - name: Install browser QA tools
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Regress independent Preact/PixiJS and prior Vite browser behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p l3-023-acceptance/dev-boundary l3-023-acceptance/preview-boundary
          mkdir -p l3-023-acceptance/dev-vite l3-023-acceptance/preview-vite
          npm run dev -- --strictPort > l3-023-acceptance/dev-server.log 2>&1 &
          dp=$!
          npm run preview -- --strictPort > l3-023-acceptance/preview-server.log 2>&1 &
          pp=$!
          trap 'kill "$dp" "$pp" 2>/dev/null || true' EXIT
          for port in 5173 4173; do
            ready=0
            for i in $(seq 1 40); do
              if curl -fsS "http://127.0.0.1:$port/" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" != 1 ]; then echo "Vite server unavailable on port $port"; exit 1; fi
          done
          python scripts/chromium-boundary-qa.py --base-url http://127.0.0.1:5173/ --out l3-023-acceptance/dev-boundary
          python scripts/chromium-boundary-qa.py --base-url http://127.0.0.1:4173/ --out l3-023-acceptance/preview-boundary
          python scripts/chromium-vite-qa.py --base-url http://127.0.0.1:5173/ --out l3-023-acceptance/dev-vite
          python scripts/chromium-vite-qa.py --base-url http://127.0.0.1:4173/ --out l3-023-acceptance/preview-vite
      - name: Save reproducible QA evidence
        if: always()
        shell: bash
        run: |
          mkdir -p l3-023-acceptance
          test ! -d dist || cp -a dist l3-023-acceptance/dist
          cp docs/L3-023-ROUTE-STATE.md l3-023-acceptance/route-contract.md
          git status --short > l3-023-acceptance/git-status.txt
          git log -7 --oneline > l3-023-acceptance/git-history.txt
      - name: Upload evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEGACY3-L3-023-route-state
          path: l3-023-acceptance/
          if-no-files-found: warn
          retention-days: 30
