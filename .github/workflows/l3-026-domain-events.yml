name: LEGACY 3.0 L3-026 Domain Event Contract Acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-events:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clean pinned npm installation
        run: npm ci --no-audit --no-fund
      - name: Verify valid domain event types and six intentionally invalid payloads
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run typecheck:events
          npm run test:events
      - name: Verify domain graph, strict TypeScript, earlier contracts and genuine Vite
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run check:vite
          npm run lint:domains
          npm run typecheck:clock
          npm run typecheck:random
          npm run typecheck
          npm run test:types:negative
          npm run lint
          npm test
          npm run build
      - name: Install Chromium QA tools
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Regress real Vite dev and preview browser behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p l3-026-acceptance/{dev-boundary,preview-boundary,dev-vite,preview-vite}
          npm run dev -- --strictPort > l3-026-acceptance/dev-server.log 2>&1 &
          dp=$!
          npm run preview -- --strictPort > l3-026-acceptance/preview-server.log 2>&1 &
          pp=$!
          trap 'kill "$dp" "$pp" 2>/dev/null || true' EXIT
          for port in 5173 4173; do
            ready=0
            for i in $(seq 1 40); do
              if curl -fsS "http://127.0.0.1:$port/" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" != 1 ]; then echo "Real Vite server unavailable: $port"; exit 1; fi
          done
          python scripts/chromium-boundary-qa.py --base-url http://127.0.0.1:5173/ --out l3-026-acceptance/dev-boundary
          python scripts/chromium-boundary-qa.py --base-url http://127.0.0.1:4173/ --out l3-026-acceptance/preview-boundary
          python scripts/chromium-vite-qa.py --base-url http://127.0.0.1:5173/ --out l3-026-acceptance/dev-vite
          python scripts/chromium-vite-qa.py --base-url http://127.0.0.1:4173/ --out l3-026-acceptance/preview-vite
      - name: Save auditable acceptance evidence
        if: always()
        shell: bash
        run: |
          mkdir -p l3-026-acceptance
          test ! -d dist || cp -a dist l3-026-acceptance/dist
          cp docs/L3-026-DOMAIN-EVENTS.md l3-026-acceptance/event-contract.md
          cp docs/task-register.json l3-026-acceptance/task-register.json
          git status --short > l3-026-acceptance/git-status.txt
          git log --oneline -10 > l3-026-acceptance/git-history.txt
      - name: Upload event contract, compiled output and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEGACY3-L3-026-domain-events
          path: l3-026-acceptance/
          if-no-files-found: warn
          retention-days: 30
