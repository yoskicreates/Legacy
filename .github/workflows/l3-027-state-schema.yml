name: LEGACY 3.0 L3-027 State Schema Acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out proposed milestone
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clean pinned dependencies with no fallback
        run: npm ci --no-audit --no-fund
      - name: Strict positive and deliberately invalid schema type tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run typecheck:state
          node --test tests/game-state-schema.test.mjs
      - name: Regress architecture, all earlier contracts, and real production build
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run check:vite
          npm run lint:domains
          npm run typecheck:clock
          npm run typecheck:random
          npm run typecheck:events
          npm run typecheck
          npm run test:types:negative
          npm run lint
          npm test
          npm run build
      - name: Install Chromium test tools
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test real Vite development and production preview in Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p l3-027-acceptance/{dev-boundary,preview-boundary,dev-vite,preview-vite}
          npm run dev -- --strictPort > l3-027-acceptance/dev-server.log 2>&1 &
          devpid=$!
          npm run preview -- --strictPort > l3-027-acceptance/preview-server.log 2>&1 &
          prepid=$!
          trap 'kill "$devpid" "$prepid" 2>/dev/null || true' EXIT
          for port in 5173 4173; do
            ready=0
            for i in $(seq 1 40); do
              if curl -fsS "http://127.0.0.1:$port/" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" != 1 ]; then echo "Vite server unavailable: $port"; exit 1; fi
          done
          python scripts/chromium-boundary-qa.py --base-url http://127.0.0.1:5173/ --out l3-027-acceptance/dev-boundary
          python scripts/chromium-boundary-qa.py --base-url http://127.0.0.1:4173/ --out l3-027-acceptance/preview-boundary
          python scripts/chromium-vite-qa.py --base-url http://127.0.0.1:5173/ --out l3-027-acceptance/dev-vite
          python scripts/chromium-vite-qa.py --base-url http://127.0.0.1:4173/ --out l3-027-acceptance/preview-vite
      - name: Save acceptance evidence regardless of result
        if: always()
        shell: bash
        run: |
          mkdir -p l3-027-acceptance
          test ! -d dist || cp -a dist l3-027-acceptance/dist
          cp docs/L3-027-STATE-SCHEMA.md l3-027-acceptance/state-schema.md
          cp docs/L3-027-ACCEPTANCE.json l3-027-acceptance/local-report.json
          cp docs/task-register.json l3-027-acceptance/task-register.json
          git status --short > l3-027-acceptance/git-status.txt
          git log --oneline -10 > l3-027-acceptance/git-history.txt
      - name: Upload QA report, build and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEGACY3-L3-027-state-schema
          path: l3-027-acceptance/
          if-no-files-found: warn
          retention-days: 30
