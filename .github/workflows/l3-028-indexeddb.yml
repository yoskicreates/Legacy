name: LEGACY 3.0 L3-028 IndexedDB Acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexeddb:
    # L3-041 consolidates all inherited regression coverage into one job.
    # Avoid duplicate jobs only for this review PR, not main or other branches.
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'l3-041-panel-card-kit' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out proposed L3-028 source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clean dependency install without fallbacks
        run: npm ci --no-audit --no-fund
      - name: Strict IndexedDB types, deliberate rejected types, and isolated tests
        run: |
          set -Eeuo pipefail
          npm run typecheck:indexeddb
          npm run test:indexeddb:negative
          npm run test:indexeddb
      - name: Full earlier regression and genuine Vite build
        run: |
          set -Eeuo pipefail
          npm run check:vite
          npm run lint:domains
          npm run typecheck:clock
          npm run typecheck:random
          npm run typecheck:events
          npm run typecheck:state
          npm run typecheck
          npm run test:types:negative
          npm run lint
          npm test
          npm run build
          test -f dist/indexeddb-qa.html
      - name: Install Chromium browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test real IndexedDB in real Vite development and preview browsers
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p l3-028-acceptance/{indexeddb-dev,indexeddb-preview,dev-boundary,preview-boundary,dev-vite,preview-vite}
          npm run dev -- --strictPort > l3-028-acceptance/dev-server.log 2>&1 &
          devpid=$!
          npm run preview -- --strictPort > l3-028-acceptance/preview-server.log 2>&1 &
          prepid=$!
          trap 'kill "$devpid" "$prepid" 2>/dev/null || true' EXIT
          for port in 5173 4173; do
            ready=0
            for i in $(seq 1 45); do
              if curl -fsS "http://127.0.0.1:$port/" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" != 1 ]; then echo "Real Vite server unavailable: $port"; exit 1; fi
          done
          python scripts/chromium-indexeddb-qa.py --base-url http://127.0.0.1:5173 --out l3-028-acceptance/indexeddb-dev
          python scripts/chromium-indexeddb-qa.py --base-url http://127.0.0.1:4173 --out l3-028-acceptance/indexeddb-preview
          python scripts/chromium-boundary-qa.py --base-url http://127.0.0.1:5173/ --out l3-028-acceptance/dev-boundary
          python scripts/chromium-boundary-qa.py --base-url http://127.0.0.1:4173/ --out l3-028-acceptance/preview-boundary
          python scripts/chromium-vite-qa.py --base-url http://127.0.0.1:5173/ --out l3-028-acceptance/dev-vite
          python scripts/chromium-vite-qa.py --base-url http://127.0.0.1:4173/ --out l3-028-acceptance/preview-vite
      - name: Preserve acceptance evidence
        if: always()
        run: |
          mkdir -p l3-028-acceptance
          test ! -d dist || cp -a dist l3-028-acceptance/dist
          cp docs/L3-028-STORAGE.md l3-028-acceptance/storage-spec.md
          cp docs/L3-028-ACCEPTANCE.json l3-028-acceptance/acceptance.json
          cp docs/task-register.json l3-028-acceptance/task-register.json
          git status --short > l3-028-acceptance/git-status.txt
          git log --oneline -10 > l3-028-acceptance/git-history.txt
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEGACY3-L3-028-indexeddb
          path: l3-028-acceptance/
          retention-days: 30
          if-no-files-found: warn
