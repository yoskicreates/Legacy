name: LEGACY 3.0 L3-043 Confirmation Dialog Acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout full history and source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clean pinned dependency install
        run: npm ci --no-audit --no-fund
      - name: Strict types, eight negative fixtures, and all inherited tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run check:vite
          npm run typecheck
          npm run typecheck:confirm-dialog
          npm run test:confirm-dialog:negative
          npm run test:confirm-dialog
          npm run typecheck:selection-card
          npm run test:selection-card:negative
          npm run test:selection-card
          npm run typecheck:panel-kit
          npm run test:panel-kit:negative
          npm run test:panel-kit
          npm run lint:domains
          npm run lint
          npm run test:types:negative
          npm test
          npm run build
          test -f dist/confirm-dialog-qa.html
          test -f dist/selection-card-qa.html
          test -f dist/panel-kit-qa.html
      - name: Independently verify hashed manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run manifest:generate
          npm run manifest:verify
          test -f dist/build-manifest.json
      - name: Install genuine Chromium
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test real Vite dev and preview on mobile Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p l3-043-acceptance/{dev,preview}
          npm run dev -- --strictPort > l3-043-acceptance/dev-server.log 2>&1 &
          dp=$!
          npm run preview -- --strictPort > l3-043-acceptance/preview-server.log 2>&1 &
          pp=$!
          trap 'kill "$dp" "$pp" 2>/dev/null || true' EXIT
          for port in 5173 4173; do
            ready=0
            for i in $(seq 1 45); do
              if curl -fsS "http://127.0.0.1:$port/confirm-dialog-qa.html" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            test "$ready" = 1 || { echo "Vite unavailable $port"; exit 1; }
          done
          python scripts/chromium-confirm-dialog-qa.py --base-url http://127.0.0.1:5173 --out l3-043-acceptance/dev
          python scripts/chromium-confirm-dialog-qa.py --base-url http://127.0.0.1:4173 --out l3-043-acceptance/preview
      - name: Preserve complete evidence and source
        if: always()
        shell: bash
        run: |
          mkdir -p l3-043-acceptance
          test ! -d dist || cp -a dist l3-043-acceptance/dist
          test ! -f dist/build-manifest.json || cp dist/build-manifest.json l3-043-acceptance/build-manifest.json
          cp docs/L3-043-S01-MODAL-PREVIEW.md l3-043-acceptance/contract.md
          cp docs/task-register.json l3-043-acceptance/task-register.json
          git status --short > l3-043-acceptance/git-status.txt
          git log --oneline --all > l3-043-acceptance/git-history.txt
          git bundle create l3-043-acceptance/complete-history.bundle --all
          git bundle verify l3-043-acceptance/complete-history.bundle
          git archive --format=zip HEAD -o l3-043-acceptance/tested-source.zip
      - name: Upload actual QA evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEGACY3-L3-043-confirmation-dialog
          path: l3-043-acceptance/
          if-no-files-found: warn
          retention-days: 30
